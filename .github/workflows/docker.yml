name: Build NZBPostarr Unraid image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - .github/workflows/docker.yml

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: https://github.com/polyn0mial/NZBPostarr.git

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Resolve current upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git ls-remote "$UPSTREAM_REPO" refs/heads/main | awk '{print $1}')"
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $SHA"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether a build is needed
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="upstream-${{ steps.upstream.outputs.short }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          EXISTS=false
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            EXISTS=true
          fi

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$EXISTS" = "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Image for upstream commit $TAG already exists; scheduled build skipped."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Build required."
          fi

      - name: Set up Docker Buildx
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            UPSTREAM_REF=${{ steps.upstream.outputs.sha }}
          tags: |
            ${{ steps.decision.outputs.image }}:latest
            ${{ steps.decision.outputs.image }}:upstream-${{ steps.upstream.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.nzbpostarr.upstream.repository=https://github.com/polyn0mial/NZBPostarr
            io.nzbpostarr.upstream.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
